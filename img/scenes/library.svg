<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efe2"/><stop offset="1" stop-color="#e6d6bc"/></linearGradient>
<radialGradient id="lamp"><stop offset="0" stop-color="#fff3c4" stop-opacity=".9"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient></defs>
<style>
 .page{transform-origin:400px 0;animation:flip 3s cubic-bezier(.45,0,.3,1) infinite}
 @keyframes flip{0%,15%{transform:scaleX(1)}60%,100%{transform:scaleX(-1)}}
 .shade{animation:shade 3s cubic-bezier(.45,0,.3,1) infinite}@keyframes shade{0%,15%{opacity:0}37%{opacity:.35}60%,100%{opacity:0}}
 .word{animation:float 3s ease-in-out infinite;transform-box:fill-box}@keyframes float{0%,40%{transform:translateY(0);opacity:0}55%{opacity:1}100%{transform:translateY(-80px);opacity:0}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>
<!-- shelf behind -->
<g><rect x="0" y="40" width="800" height="12" fill="#8b5e34"/><rect x="0" y="150" width="800" height="12" fill="#8b5e34"/>
<g fill-opacity=".85"><rect x="30" y="62" width="22" height="88" fill="#b23a48"/><rect x="54" y="72" width="18" height="78" fill="#2e6f95"/><rect x="74" y="58" width="26" height="92" fill="#e0a526"/><rect x="102" y="68" width="20" height="82" fill="#4f7d4a"/><rect x="124" y="62" width="24" height="88" fill="#6b4c9a"/>
<rect x="600" y="62" width="22" height="88" fill="#2e6f95"/><rect x="624" y="70" width="26" height="80" fill="#b23a48"/><rect x="652" y="58" width="20" height="92" fill="#4f7d4a"/><rect x="674" y="66" width="24" height="84" fill="#e0a526"/><rect x="700" y="62" width="22" height="88" fill="#6b4c9a"/><rect x="724" y="72" width="26" height="78" fill="#b23a48"/></g></g>
<circle cx="400" cy="230" r="230" fill="url(#lamp)"/>
<!-- open book -->
<g transform="translate(0 40)">
<path d="M150 210 Q275 180 400 210 L400 400 Q275 370 150 400 Z" fill="#fffaf0" stroke="#c9b48e" stroke-width="3"/>
<path d="M650 210 Q525 180 400 210 L400 400 Q525 370 650 400 Z" fill="#fffaf0" stroke="#c9b48e" stroke-width="3"/>
<g stroke="#c9b48e" stroke-width="3"><line x1="180" y1="250" x2="370" y2="240"/><line x1="180" y1="280" x2="370" y2="270"/><line x1="180" y1="310" x2="370" y2="300"/><line x1="180" y1="340" x2="330" y2="332"/>
<line x1="430" y1="240" x2="620" y2="250"/><line x1="430" y1="270" x2="620" y2="280"/><line x1="430" y1="300" x2="620" y2="310"/><line x1="430" y1="330" x2="580" y2="338"/></g>
<path d="M140 400 Q275 372 400 404 Q525 372 660 400 L660 412 Q525 384 400 416 Q275 384 140 412 Z" fill="#7a2e2e"/>
<!-- turning page -->
<g class="page"><path d="M400 210 Q525 182 640 208 L640 398 Q525 372 400 400 Z" fill="#fffdf6" stroke="#c9b48e" stroke-width="2"/>
 <path class="shade" d="M400 210 Q525 182 640 208 L640 398 Q525 372 400 400 Z" fill="#7a5a30"/>
 <g stroke="#e0d2b4" stroke-width="3"><line x1="430" y1="245" x2="610" y2="252"/><line x1="430" y1="275" x2="610" y2="282"/><line x1="430" y1="305" x2="610" y2="312"/></g></g>
</g>
<g font-size="26" fill="#7a2e2e" font-style="italic">
 <text class="word" x="250" y="250">Once</text><text class="word" style="animation-delay:.5s" x="380" y="230">upon</text><text class="word" style="animation-delay:1s" x="500" y="250">a time</text></g>
<text x="400" y="485" text-anchor="middle" font-size="22" fill="#5a3a1a" font-style="italic">Libraria Bookshop · Novels · Poetry · Kids</text>
</svg>
