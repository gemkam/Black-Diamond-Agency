<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff5f5"/><stop offset="1" stop-color="#ffe0e0"/></linearGradient></defs>
<style>
 .tap{animation:tap 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes tap{0%,20%{transform:scale(1)}25%{transform:scale(.88)}30%,100%{transform:scale(1)}}
 .fly{animation:fly 3s cubic-bezier(.4,0,.2,1) infinite}
 @keyframes fly{0%,25%{transform:translate(0,0) scale(1);opacity:0}30%{opacity:1}70%{transform:translate(290px,95px) scale(.8);opacity:1}78%,100%{transform:translate(290px,140px) scale(.6);opacity:0}}
 .cart{animation:bump 3s ease infinite;transform-box:fill-box;transform-origin:bottom}
 @keyframes bump{0%,72%,100%{transform:translateY(0)}76%{transform:translateY(6px)}82%{transform:translateY(-4px)}}
 .badge{animation:pop 3s ease infinite;transform-box:fill-box;transform-origin:center}
 @keyframes pop{0%,74%{transform:scale(1)}80%{transform:scale(1.45)}88%,100%{transform:scale(1)}}
 .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>
<rect y="430" width="800" height="70" fill="#f3c6c6"/>
<!-- Oman flag accent -->
<rect x="0" y="0" width="16" height="500" fill="#c8102e"/>
<!-- phone -->
<rect x="90" y="60" width="200" height="360" rx="28" fill="#1f1f2b"/>
<rect x="102" y="80" width="176" height="320" rx="16" fill="#fff"/>
<rect x="102" y="80" width="176" height="44" rx="16" fill="#c8102e"/><text x="190" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">SuuqiFy</text>
<g><rect x="114" y="136" width="72" height="80" rx="10" fill="#ffe7cc"/><rect x="194" y="136" width="72" height="80" rx="10" fill="#dff1ff"/>
 <rect x="114" y="226" width="72" height="80" rx="10" fill="#e6ffe9"/><rect x="194" y="226" width="72" height="80" rx="10" fill="#f6e6ff"/>
 <rect x="132" y="150" width="36" height="30" rx="6" fill="#ff9f43"/><circle cx="230" cy="168" r="17" fill="#54a0ff"/><rect x="134" y="242" width="32" height="40" rx="8" fill="#1dd1a1"/><path d="M215 285 l15 -40 15 40z" fill="#a55eea"/>
 <text x="150" y="208" text-anchor="middle" font-size="11" fill="#555">OMR 7.200</text><text x="230" y="208" text-anchor="middle" font-size="11" fill="#555">OMR 12.5</text>
 <text x="150" y="298" text-anchor="middle" font-size="11" fill="#555">OMR 3.900</text><text x="230" y="298" text-anchor="middle" font-size="11" fill="#555">OMR 9.000</text></g>
<g class="tap"><rect x="114" y="318" width="152" height="34" rx="17" fill="#c8102e"/><text x="190" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Add to cart</text></g>
<text x="190" y="380" text-anchor="middle" font-size="11" fill="#c8102e">Cash on Delivery</text>
<!-- flying product -->
<g class="fly"><rect x="132" y="150" width="36" height="30" rx="6" fill="#ff9f43"/></g>
<!-- cart -->
<g class="cart">
 <path d="M410 230 L440 230 L470 350 L620 350 L650 260 L455 260" fill="none" stroke="#333" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
 <rect x="465" y="270" width="170" height="70" rx="6" fill="#c8102e" opacity=".15"/>
 <rect x="480" y="285" width="40" height="45" rx="6" fill="#54a0ff"/><rect x="530" y="295" width="34" height="35" rx="6" fill="#1dd1a1"/>
 <g class="wheel"><circle cx="490" cy="380" r="18" fill="#333"/><rect x="487" y="364" width="6" height="32" fill="#888"/></g>
 <g class="wheel"><circle cx="600" cy="380" r="18" fill="#333"/><rect x="597" y="364" width="6" height="32" fill="#888"/></g>
 <g class="badge"><circle cx="645" cy="235" r="22" fill="#c8102e"/><text x="645" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">3</text></g>
</g>
<text x="560" y="140" text-anchor="middle" font-size="28" font-weight="bold" fill="#c8102e">Shop online in Oman</text>
<text x="560" y="172" text-anchor="middle" font-size="16" fill="#7a3a3a">Prices in OMR · Delivery nationwide</text>
</svg>
