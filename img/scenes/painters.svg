<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
<style>
 .roll{animation:roll 4s ease-in-out infinite}
 @keyframes roll{0%{transform:translateY(0)}25%{transform:translateY(-70px)}50%{transform:translateY(0)}75%{transform:translateY(-70px)}100%{transform:translateY(0)}}
 .fresh{transform-box:fill-box;transform-origin:50% 100%;animation:fill 8s ease-in-out infinite}
 @keyframes fill{0%{transform:scaleY(0)}12%{transform:scaleY(1)}100%{transform:scaleY(1)}}
 .band1{animation:band 8s linear infinite}@keyframes band{0%,10%{width:0}100%{width:520px}}
 .drip{animation:drip 2s ease-in infinite;transform-box:fill-box}@keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(40px);opacity:0}}
 .painter{animation:step 8s linear infinite}@keyframes step{0%{transform:translateX(0)}100%{transform:translateX(420px)}}
</style>
<rect width="800" height="500" fill="#ece6dd"/>
<!-- wall being painted: fresh colour sweeps across -->
<rect x="80" y="60" width="640" height="340" fill="#d8d0c2"/>
<clipPath id="cl"><rect x="80" y="60" width="0" height="340"><animate attributeName="width" values="0;640;640" keyTimes="0;.85;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
<rect x="80" y="60" width="640" height="340" fill="#4db6ac" clip-path="url(#cl)"/>
<rect x="80" y="60" width="640" height="18" fill="#fff"/>
<rect y="400" width="800" height="100" fill="#b8a991"/>
<!-- painter with roller moving along -->
<g class="painter">
 <g class="roll"><line x1="140" y1="330" x2="140" y2="390" stroke="#555" stroke-width="5"/><rect x="118" y="310" width="44" height="22" rx="10" fill="#4db6ac" stroke="#2c7a73" stroke-width="2"/><rect x="137" y="388" width="6" height="40" fill="#e07a2e"/></g>
 <circle cx="70" cy="300" r="22" fill="#c98d64"/><path d="M48 292 Q50 270 72 272 Q94 274 92 292 Z" fill="#ffffff"/><rect x="46" y="286" width="48" height="8" rx="3" fill="#e0e0e0"/>
 <path d="M45 325 Q70 315 95 325 L100 420 L40 420 Z" fill="#3b6ea5"/><rect x="50" y="325" width="40" height="40" fill="#ffffff" opacity=".9"/>
 <path d="M92 340 Q120 360 138 400" stroke="#c98d64" stroke-width="12" stroke-linecap="round" fill="none"/>
 <rect x="45" y="420" width="18" height="30" fill="#2b2b33"/><rect x="77" y="420" width="18" height="30" fill="#2b2b33"/>
</g>
<!-- tray & bucket -->
<path d="M600 450 l20 -30 h120 l-10 30z" fill="#9aa0a6"/><path d="M630 425 h90 l-6 15 h-84z" fill="#4db6ac"/>
<rect x="520" y="400" width="60" height="55" rx="6" fill="#e07a2e"/><ellipse cx="550" cy="400" rx="30" ry="8" fill="#4db6ac"/>
<circle class="drip" cx="530" cy="410" r="4" fill="#4db6ac"/>
<text x="400" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#2c4a6b">SUPER PAINTERS</text>
<text x="400" y="485" text-anchor="middle" font-size="16" fill="#3a3a3a">Homes · Offices · Commercial · Fine Art</text>
</svg>
