<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1c"/><stop offset="1" stop-color="#14213a"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9a24a"/><stop offset="1" stop-color="#f1d27a"/></linearGradient>
</defs>
<style>
 .row{opacity:0;animation:rin 6s ease-out infinite}
 .r2{animation-delay:.6s}.r3{animation-delay:1.2s}.r4{animation-delay:1.8s}
 @keyframes rin{0%{opacity:0;transform:translateX(-20px)}10%,85%{opacity:1;transform:translateX(0)}100%{opacity:0}}
 .sweep{transform-origin:576px 306px;animation:spin 4s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
 .dot{animation:blip 4s linear infinite}
 @keyframes blip{0%{opacity:1}60%,100%{opacity:.18}}
 .ring{transform-box:fill-box;transform-origin:center;animation:ring 4s ease-out infinite}
 @keyframes ring{0%{opacity:1;transform:scale(.4)}30%,100%{opacity:0;transform:scale(2.6)}}
 .lbl{animation:lbl 4s linear infinite}
 @keyframes lbl{0%{opacity:0}4%,55%{opacity:1}70%,100%{opacity:0}}
 .pulse{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
 .spark{animation:sp 3s linear infinite}@keyframes sp{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(670px,0);opacity:0}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>
<!-- window -->
<rect x="40" y="40" width="720" height="420" rx="18" fill="#0f172a" stroke="#c9a24a" stroke-opacity=".35"/>
<circle cx="70" cy="68" r="6" fill="#ef4444"/><circle cx="90" cy="68" r="6" fill="#f59e0b"/><circle cx="110" cy="68" r="6" fill="#22c55e"/>
<text x="140" y="73" fill="#e5e7eb" font-size="15" font-weight="bold">AI Lead Agent</text>
<circle class="pulse" cx="690" cy="68" r="5" fill="#22c55e"/><text x="702" y="73" fill="#9ca3af" font-size="12">Live</text>
<line x1="40" y1="92" x2="760" y2="92" stroke="#1f2937"/>
<!-- stat tiles -->
<g font-size="11" fill="#9ca3af">
 <rect x="64" y="110" width="160" height="70" rx="10" fill="#111c33"/><text x="80" y="134">Leads found</text><text x="80" y="164" fill="#f1d27a" font-size="26" font-weight="bold">128</text>
 <rect x="236" y="110" width="160" height="70" rx="10" fill="#111c33"/><text x="252" y="134">Emails drafted</text><text x="252" y="164" fill="#e5e7eb" font-size="26" font-weight="bold">94</text>
 <rect x="408" y="110" width="160" height="70" rx="10" fill="#111c33"/><text x="424" y="134">Replies</text><text x="424" y="164" fill="#22c55e" font-size="26" font-weight="bold">17</text>
 <rect x="580" y="110" width="156" height="70" rx="10" fill="#111c33"/><text x="596" y="134">Meetings</text><text x="596" y="164" fill="#38bdf8" font-size="26" font-weight="bold">6</text>
</g>
<!-- lead list -->
<g font-size="12">
 <g class="row"><rect x="64" y="200" width="336" height="44" rx="8" fill="#111c33"/><circle cx="86" cy="222" r="9" fill="url(#gold)"/><text x="104" y="226" fill="#e5e7eb">Nova IT Solutions</text><rect x="296" y="211" width="90" height="22" rx="11" fill="#22c55e" fill-opacity=".18"/><text x="313" y="226" fill="#22c55e" font-size="11">Replied</text></g>
 <g class="row r2"><rect x="64" y="252" width="336" height="44" rx="8" fill="#111c33"/><circle cx="86" cy="274" r="9" fill="url(#gold)"/><text x="104" y="278" fill="#e5e7eb">Grand Palm Hotel</text><rect x="296" y="263" width="90" height="22" rx="11" fill="#38bdf8" fill-opacity=".18"/><text x="309" y="278" fill="#38bdf8" font-size="11">Meeting</text></g>
 <g class="row r3"><rect x="64" y="304" width="336" height="44" rx="8" fill="#111c33"/><circle cx="86" cy="326" r="9" fill="url(#gold)"/><text x="104" y="330" fill="#e5e7eb">Al Fajr Intl School</text><rect x="296" y="315" width="90" height="22" rx="11" fill="#f1d27a" fill-opacity=".18"/><text x="314" y="330" fill="#f1d27a" font-size="11">Drafted</text></g>
 <g class="row r4"><rect x="64" y="356" width="336" height="44" rx="8" fill="#111c33"/><circle cx="86" cy="378" r="9" fill="url(#gold)"/><text x="104" y="382" fill="#e5e7eb">Sahwa Medical Clinic</text><rect x="296" y="367" width="90" height="22" rx="11" fill="#9ca3af" fill-opacity=".18"/><text x="320" y="382" fill="#9ca3af" font-size="11">New</text></g>
</g>
<!-- lead radar -->
<rect x="416" y="200" width="320" height="200" rx="10" fill="#111c33"/>
<text x="430" y="222" fill="#9ca3af" font-size="11">Lead radar</text>
<circle class="pulse" cx="642" cy="218" r="3.5" fill="#22c55e"/><text x="724" y="222" text-anchor="end" fill="#22c55e" font-size="10">Scanning Muscat</text>
<defs>
 <radialGradient id="rg"><stop offset="0" stop-color="#16294a"/><stop offset="1" stop-color="#0c1628"/></radialGradient>
 <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1d27a" stop-opacity="0"/><stop offset="1" stop-color="#f1d27a" stop-opacity=".5"/></linearGradient>
</defs>
<circle cx="576" cy="306" r="84" fill="url(#rg)" stroke="#c9a24a" stroke-opacity=".45"/>
<g fill="none" stroke="#c9a24a" stroke-opacity=".18">
 <circle cx="576" cy="306" r="56"/><circle cx="576" cy="306" r="28"/>
 <line x1="492" y1="306" x2="660" y2="306"/><line x1="576" y1="222" x2="576" y2="390"/>
</g>
<g class="sweep">
 <path d="M576 306 L522.0 241.7 A84 84 0 0 1 576 222 Z" fill="url(#sw)"/>
 <line x1="576" y1="306" x2="576" y2="222" stroke="#f1d27a" stroke-width="2"/>
</g>
<circle cx="576" cy="306" r="3" fill="#f1d27a"/>
 <g style="animation-delay:-3.44s">
  <circle class="ring" cx="623.5" cy="266.1" r="5" fill="none" stroke="#f1d27a" stroke-width="1.5" style="animation-delay:-3.44s"/>
  <circle class="dot" cx="623.5" cy="266.1" r="4" fill="#f1d27a" style="animation-delay:-3.44s"/>
  <g class="lbl" style="animation-delay:-3.44s" text-anchor="start"><text x="632.5" y="264.1" fill="#ffffff" font-size="10" font-weight="bold">Nova IT Solutions</text><text x="632.5" y="276.1" fill="#f1d27a" font-size="9">IT business</text></g>
 </g>
 <g style="animation-delay:-2.44s">
  <circle class="ring" cx="617.1" cy="355.0" r="5" fill="none" stroke="#f1d27a" stroke-width="1.5" style="animation-delay:-2.44s"/>
  <circle class="dot" cx="617.1" cy="355.0" r="4" fill="#f1d27a" style="animation-delay:-2.44s"/>
  <g class="lbl" style="animation-delay:-2.44s" text-anchor="start"><text x="626.1" y="353.0" fill="#ffffff" font-size="10" font-weight="bold">Grand Palm Hotel</text><text x="626.1" y="365.0" fill="#f1d27a" font-size="9">Hotel</text></g>
 </g>
 <g style="animation-delay:-1.47s">
  <circle class="ring" cx="532.9" cy="344.8" r="5" fill="none" stroke="#f1d27a" stroke-width="1.5" style="animation-delay:-1.47s"/>
  <circle class="dot" cx="532.9" cy="344.8" r="4" fill="#f1d27a" style="animation-delay:-1.47s"/>
  <g class="lbl" style="animation-delay:-1.47s" text-anchor="end"><text x="523.9" y="342.8" fill="#ffffff" font-size="10" font-weight="bold">Al Fajr Intl School</text><text x="523.9" y="354.8" fill="#f1d27a" font-size="9">School</text></g>
 </g>
 <g style="animation-delay:-0.47s">
  <circle class="ring" cx="541.2" cy="267.4" r="5" fill="none" stroke="#f1d27a" stroke-width="1.5" style="animation-delay:-0.47s"/>
  <circle class="dot" cx="541.2" cy="267.4" r="4" fill="#f1d27a" style="animation-delay:-0.47s"/>
  <g class="lbl" style="animation-delay:-0.47s" text-anchor="end"><text x="532.2" y="265.4" fill="#ffffff" font-size="10" font-weight="bold">Sahwa Medical Clinic</text><text x="532.2" y="277.4" fill="#f1d27a" font-size="9">Clinic</text></g>
 </g>
<!-- AI spark line -->
<line x1="64" y1="428" x2="736" y2="428" stroke="#1f2937" stroke-width="2"/>
<circle class="spark" cx="64" cy="428" r="5" fill="#f1d27a"/>
<text x="64" y="448" fill="#6b7280" font-size="11">Find leads  →  Draft emails  →  Approve  →  Track replies</text>
</svg>
