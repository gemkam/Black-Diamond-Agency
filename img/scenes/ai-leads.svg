<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1c"/><stop offset="1" stop-color="#14213a"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9a24a"/><stop offset="1" stop-color="#f1d27a"/></linearGradient>
</defs>
<style>
 .row{opacity:0;animation:rin 6s ease-out infinite}
 .r2{animation-delay:.6s}.r3{animation-delay:1.2s}.r4{animation-delay:1.8s}
 @keyframes rin{0%{opacity:0;transform:translateX(-20px)}10%,85%{opacity:1;transform:translateX(0)}100%{opacity:0}}
 .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 6s ease-in-out infinite}
 .b2{animation-delay:.3s}.b3{animation-delay:.6s}.b4{animation-delay:.9s}.b5{animation-delay:1.2s}
 @keyframes grow{0%{transform:scaleY(.15)}35%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
 .pulse{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
 .spark{animation:sp 3s linear infinite}@keyframes sp{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(670px,0);opacity:0}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>
<!-- window -->
<rect x="40" y="40" width="720" height="420" rx="18" fill="#0f172a" stroke="#c9a24a" stroke-opacity=".35"/>
<circle cx="70" cy="68" r="6" fill="#ef4444"/><circle cx="90" cy="68" r="6" fill="#f59e0b"/><circle cx="110" cy="68" r="6" fill="#22c55e"/>
<text x="140" y="73" fill="#e5e7eb" font-size="15" font-weight="bold">AI Lead Agent</text>
<circle class="pulse" cx="690" cy="68" r="5" fill="#22c55e"/><text x="702" y="73" fill="#9ca3af" font-size="12">Live</text>
<line x1="40" y1="92" x2="760" y2="92" stroke="#1f2937"/>
<!-- stat tiles -->
<g font-size="11" fill="#9ca3af">
 <rect x="64" y="110" width="160" height="70" rx="10" fill="#111c33"/><text x="80" y="134">Leads found</text><text x="80" y="164" fill="#f1d27a" font-size="26" font-weight="bold">128</text>
 <rect x="236" y="110" width="160" height="70" rx="10" fill="#111c33"/><text x="252" y="134">Emails drafted</text><text x="252" y="164" fill="#e5e7eb" font-size="26" font-weight="bold">94</text>
 <rect x="408" y="110" width="160" height="70" rx="10" fill="#111c33"/><text x="424" y="134">Replies</text><text x="424" y="164" fill="#22c55e" font-size="26" font-weight="bold">17</text>
 <rect x="580" y="110" width="156" height="70" rx="10" fill="#111c33"/><text x="596" y="134">Meetings</text><text x="596" y="164" fill="#38bdf8" font-size="26" font-weight="bold">6</text>
</g>
<!-- lead list -->
<g font-size="12">
 <g class="row"><rect x="64" y="200" width="420" height="44" rx="8" fill="#111c33"/><circle cx="86" cy="222" r="9" fill="url(#gold)"/><text x="104" y="226" fill="#e5e7eb">Facility Services Co.</text><rect x="380" y="211" width="90" height="22" rx="11" fill="#22c55e" fill-opacity=".18"/><text x="397" y="226" fill="#22c55e" font-size="11">Replied</text></g>
 <g class="row r2"><rect x="64" y="252" width="420" height="44" rx="8" fill="#111c33"/><circle cx="86" cy="274" r="9" fill="url(#gold)"/><text x="104" y="278" fill="#e5e7eb">Training Institute</text><rect x="380" y="263" width="90" height="22" rx="11" fill="#38bdf8" fill-opacity=".18"/><text x="393" y="278" fill="#38bdf8" font-size="11">Meeting</text></g>
 <g class="row r3"><rect x="64" y="304" width="420" height="44" rx="8" fill="#111c33"/><circle cx="86" cy="326" r="9" fill="url(#gold)"/><text x="104" y="330" fill="#e5e7eb">Events &amp; Signage</text><rect x="380" y="315" width="90" height="22" rx="11" fill="#f1d27a" fill-opacity=".18"/><text x="398" y="330" fill="#f1d27a" font-size="11">Drafted</text></g>
 <g class="row r4"><rect x="64" y="356" width="420" height="44" rx="8" fill="#111c33"/><circle cx="86" cy="378" r="9" fill="url(#gold)"/><text x="104" y="382" fill="#e5e7eb">Pest Control LLC</text><rect x="380" y="367" width="90" height="22" rx="11" fill="#9ca3af" fill-opacity=".18"/><text x="404" y="382" fill="#9ca3af" font-size="11">New</text></g>
</g>
<!-- chart -->
<rect x="504" y="200" width="232" height="200" rx="10" fill="#111c33"/>
<text x="520" y="224" fill="#9ca3af" font-size="11">Weekly outreach</text>
<g fill="url(#gold)">
 <rect class="bar" x="526" y="300" width="26" height="80" rx="4"/>
 <rect class="bar b2" x="566" y="270" width="26" height="110" rx="4"/>
 <rect class="bar b3" x="606" y="250" width="26" height="130" rx="4"/>
 <rect class="bar b4" x="646" y="285" width="26" height="95" rx="4"/>
 <rect class="bar b5" x="686" y="240" width="26" height="140" rx="4"/>
</g>
<!-- AI spark line -->
<line x1="64" y1="428" x2="736" y2="428" stroke="#1f2937" stroke-width="2"/>
<circle class="spark" cx="64" cy="428" r="5" fill="#f1d27a"/>
<text x="64" y="448" fill="#6b7280" font-size="11">Find leads  →  Draft emails  →  Approve  →  Track replies</text>
</svg>
