<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
<defs><radialGradient id="glow"><stop offset="0" stop-color="#ffe66d" stop-opacity=".9"/><stop offset="1" stop-color="#ffe66d" stop-opacity="0"/></radialGradient></defs>
<style>
 .bulb{animation:on 3s ease-in-out infinite}@keyframes on{0%,10%{opacity:.15}20%,100%{opacity:1}}
 .ray{animation:on 3s ease-in-out infinite;transform-origin:400px 95px}
 .item{animation:in 3s cubic-bezier(.3,1.4,.5,1) infinite;transform-box:fill-box;transform-origin:bottom}
 @keyframes in{0%,20%{transform:scale(0)}35%,92%{transform:scale(1)}100%{transform:scale(0)}}
 .sign{animation:sh 3s ease infinite}@keyframes sh{0%,15%{fill:#555}25%,100%{fill:#fff}}
</style>
<rect width="800" height="500" fill="#1d2440"/>
<circle cx="400" cy="95" r="160" fill="url(#glow)" class="bulb"/>
<g class="ray" stroke="#ffe66d" stroke-width="6" stroke-linecap="round"><line x1="400" y1="20" x2="400" y2="0"/><line x1="460" y1="40" x2="478" y2="26"/><line x1="340" y1="40" x2="322" y2="26"/><line x1="480" y1="95" x2="505" y2="95"/><line x1="320" y1="95" x2="295" y2="95"/></g>
<path d="M370 95 a30 30 0 1 1 60 0 c0 18 -14 24 -14 40 h-32 c0 -16 -14 -22 -14 -40z" fill="#ffe66d" class="bulb"/>
<path d="M370 95 a30 30 0 1 1 60 0 c0 18 -14 24 -14 40 h-32 c0 -16 -14 -22 -14 -40z" fill="none" stroke="#fff" stroke-width="3"/>
<rect x="386" y="138" width="28" height="14" rx="3" fill="#aaa"/>
<text x="400" y="190" text-anchor="middle" font-size="30" font-weight="bold" class="sign">BRIGHT SPOT</text>
<!-- shelves -->
<g fill="#8b5e34"><rect x="80" y="280" width="640" height="12"/><rect x="80" y="390" width="640" height="12"/><rect x="80" y="220" width="12" height="270"/><rect x="708" y="220" width="12" height="270"/></g>
<g class="item" style="animation-delay:0s"><rect x="120" y="222" width="50" height="58" rx="6" fill="#ff6b6b"/></g>
<g class="item" style="animation-delay:.12s"><rect x="190" y="236" width="40" height="44" rx="20" fill="#4ecdc4"/></g>
<g class="item" style="animation-delay:.24s"><rect x="250" y="216" width="36" height="64" rx="8" fill="#ffd93d"/></g>
<g class="item" style="animation-delay:.36s"><path d="M310 280 l30 -60 30 60z" fill="#a66cff"/></g>
<g class="item" style="animation-delay:.48s"><rect x="390" y="230" width="60" height="50" rx="6" fill="#6bcB77"/></g>
<g class="item" style="animation-delay:.6s"><circle cx="490" cy="252" r="28" fill="#ff8fab"/></g>
<g class="item" style="animation-delay:.72s"><rect x="540" y="224" width="44" height="56" rx="10" fill="#4d96ff"/></g>
<g class="item" style="animation-delay:.84s"><rect x="610" y="240" width="70" height="40" rx="6" fill="#ffb562"/></g>
<g class="item" style="animation-delay:.3s"><rect x="120" y="340" width="70" height="50" rx="6" fill="#4d96ff"/></g>
<g class="item" style="animation-delay:.42s"><circle cx="240" cy="362" r="28" fill="#ffd93d"/></g>
<g class="item" style="animation-delay:.54s"><rect x="300" y="330" width="40" height="60" rx="8" fill="#ff6b6b"/></g>
<g class="item" style="animation-delay:.66s"><rect x="370" y="346" width="80" height="44" rx="6" fill="#a66cff"/></g>
<g class="item" style="animation-delay:.78s"><rect x="480" y="334" width="40" height="56" rx="18" fill="#4ecdc4"/></g>
<g class="item" style="animation-delay:.9s"><rect x="550" y="350" width="60" height="40" rx="6" fill="#6bcB77"/></g>
<g class="item" style="animation-delay:1s"><path d="M640 390 l25 -50 25 50z" fill="#ff8fab"/></g>
<text x="400" y="460" text-anchor="middle" font-size="18" fill="#cfd6ff">Fashion · Electronics · Beauty · Home · Kids</text>
</svg>
