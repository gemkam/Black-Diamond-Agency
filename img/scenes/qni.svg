<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0b1730"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9a24a"/><stop offset="1" stop-color="#f1d27a"/></linearGradient>
</defs>
<style>
 .row{opacity:0;animation:rin 7s ease-out infinite}
 .r2{animation-delay:.5s}.r3{animation-delay:1s}.r4{animation-delay:1.5s}
 @keyframes rin{0%{opacity:0;transform:translateX(-16px)}10%,85%{opacity:1;transform:translateX(0)}100%{opacity:0}}
 .tot{opacity:0;animation:tin 7s ease-out infinite;animation-delay:2.1s}
 @keyframes tin{0%{opacity:0}10%,85%{opacity:1}100%{opacity:0}}
 .stamp{opacity:0;transform-box:fill-box;transform-origin:center;animation:st 7s ease-out infinite;animation-delay:2.8s}
 @keyframes st{0%{opacity:0;transform:scale(1.8) rotate(-14deg)}8%,80%{opacity:1;transform:scale(1) rotate(-14deg)}100%{opacity:0;transform:scale(1) rotate(-14deg)}}
 .arrow{animation:ar 1.6s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
 .pulse{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>

<!-- Quotation sheet -->
<rect x="50" y="50" width="300" height="400" rx="14" fill="#ffffff"/>
<rect x="50" y="50" width="300" height="56" rx="14" fill="#0b1730"/>
<rect x="50" y="90" width="300" height="16" fill="#0b1730"/>
<text x="72" y="85" fill="#fff" font-size="20" font-weight="700">QUOTATION</text>
<text x="330" y="85" fill="#38bdf8" font-size="14" text-anchor="end">Q-1006</text>
<text x="72" y="132" fill="#64748b" font-size="11">KIND ATTENTION</text>
<text x="72" y="150" fill="#0f172a" font-size="14" font-weight="700">Ruwi warehouse</text>
<line x1="72" y1="168" x2="328" y2="168" stroke="#e2e8f0"/>
<g class="row"><text x="72" y="194" fill="#0f172a" font-size="12">Wall painting</text><text x="230" y="194" fill="#64748b" font-size="11">30 m²</text><text x="328" y="194" fill="#0f172a" font-size="12" text-anchor="end">600.000</text></g>
<g class="row r2"><text x="72" y="220" fill="#0f172a" font-size="12">Labour</text><text x="230" y="220" fill="#64748b" font-size="11">4 days</text><text x="328" y="220" fill="#0f172a" font-size="12" text-anchor="end">200.000</text></g>
<g class="row r3"><text x="72" y="246" fill="#0f172a" font-size="12">Transport</text><text x="230" y="246" fill="#64748b" font-size="11">Lump sum</text><text x="328" y="246" fill="#0f172a" font-size="12" text-anchor="end">200.000</text></g>
<g class="row r4"><text x="72" y="272" fill="#dc2626" font-size="12">Discount</text><text x="328" y="272" fill="#dc2626" font-size="12" text-anchor="end">-200.000</text>
<text x="72" y="296" fill="#64748b" font-size="12">VAT 5%</text><text x="328" y="296" fill="#64748b" font-size="12" text-anchor="end">40.000</text></g>
<g class="tot"><rect x="72" y="314" width="256" height="40" rx="8" fill="url(#blue)"/>
<text x="86" y="339" fill="#fff" font-size="13" font-weight="700">TOTAL OMR</text><text x="314" y="340" fill="#fff" font-size="17" font-weight="700" text-anchor="end">840.000</text></g>
<g class="stamp"><rect x="150" y="372" width="120" height="42" rx="6" fill="none" stroke="#16a34a" stroke-width="3"/>
<text x="210" y="400" fill="#16a34a" font-size="17" font-weight="800" text-anchor="middle">APPROVED</text></g>

<!-- Convert arrow -->
<g class="arrow"><path d="M372 250h46" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/><path d="M412 236l18 14-18 14" fill="none" stroke="#f1d27a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>

<!-- Invoices -->
<g transform="translate(450 70)">
 <text x="0" y="0" fill="#f1d27a" font-size="13" font-weight="700" letter-spacing="2">INVOICES</text>
 <rect x="0" y="16" width="300" height="74" rx="12" fill="#111c33" stroke="#2563eb" stroke-opacity=".5"/>
 <text x="18" y="46" fill="#fff" font-size="16" font-weight="700">1001</text><text x="18" y="70" fill="#94a3b8" font-size="12">Advance</text>
 <rect x="196" y="38" width="86" height="26" rx="13" fill="#16a34a"/><text x="239" y="56" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">PAID</text>
 <rect x="0" y="104" width="300" height="74" rx="12" fill="#111c33" stroke="#2563eb" stroke-opacity=".5"/>
 <text x="18" y="134" fill="#fff" font-size="16" font-weight="700">1001-1</text><text x="18" y="158" fill="#94a3b8" font-size="12">Milestone</text>
 <rect x="196" y="126" width="86" height="26" rx="13" fill="#f59e0b"/><text x="239" y="144" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">PARTIAL</text>
 <rect x="0" y="192" width="300" height="74" rx="12" fill="#111c33" stroke="#dc2626" stroke-opacity=".6"/>
 <text x="18" y="222" fill="#fff" font-size="16" font-weight="700">1001-2</text><text x="18" y="246" fill="#94a3b8" font-size="12">Final</text>
 <rect x="196" y="214" width="86" height="26" rx="13" fill="#dc2626" class="pulse"/><text x="239" y="232" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">DUE</text>
 <rect x="0" y="286" width="300" height="74" rx="12" fill="url(#blue)"/>
 <text x="18" y="314" fill="#dbeafe" font-size="12">Balance due</text>
 <text x="18" y="342" fill="#fff" font-size="22" font-weight="800">330.000 OMR</text>
</g>
</svg>
