<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0f4"/><stop offset="1" stop-color="#f7cfdc"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7dc8f"/><stop offset=".5" stop-color="#d4a73c"/><stop offset="1" stop-color="#b58324"/></linearGradient>
 <radialGradient id="powder"><stop offset="0" stop-color="#f4b8a8"/><stop offset="1" stop-color="#e48f86"/></radialGradient>
 <linearGradient id="mir" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1dff0"/></linearGradient>
</defs>
<style>
 /* lipstick twists up */
 .lip{animation:lip 4s ease-in-out infinite}@keyframes lip{0%,10%{transform:translateY(60px)}40%,80%{transform:translateY(0)}100%{transform:translateY(60px)}}
 /* compact lid opens */
 .lid{transform-origin:330px 360px;animation:lid 4s ease-in-out infinite}@keyframes lid{0%,10%{transform:rotate(0)}35%,80%{transform:rotate(-115deg)}100%{transform:rotate(0)}}
 /* brush dusts in an arc */
 .brush{transform-origin:520px 420px;animation:dust 2.2s ease-in-out infinite}@keyframes dust{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
 .puff circle{animation:puff 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:0}25%{opacity:.85}100%{transform:translate(var(--x),-60px) scale(1.4);opacity:0}}
 /* nail polish cap lifts and the bottle shimmers */
 .cap{animation:cap 4s ease-in-out infinite}@keyframes cap{0%,15%{transform:translateY(0)}40%,75%{transform:translateY(-46px)}100%{transform:translateY(0)}}
 .shine{animation:shine 3s ease-in-out infinite}@keyframes shine{0%,100%{opacity:.15}50%{opacity:.75}}
 .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.2;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
 .glow{animation:glow 4s ease-in-out infinite}@keyframes glow{50%{opacity:.55}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>
<!-- vanity mirror with bulbs -->
<rect x="250" y="30" width="300" height="230" rx="115" fill="url(#mir)" stroke="url(#gold)" stroke-width="10"/>
<g fill="#ffe9a8" class="glow"><circle cx="262" cy="145" r="9"/><circle cx="538" cy="145" r="9"/><circle cx="400" cy="32" r="9"/><circle cx="295" cy="70" r="8"/><circle cx="505" cy="70" r="8"/></g>
<text x="400" y="150" text-anchor="middle" font-size="40" fill="#b5476e" font-style="italic">Aura Lumière</text>
<text x="400" y="185" text-anchor="middle" font-size="16" fill="#9a6a80" letter-spacing="3">BEAUTY · BRIDAL</text>
<path class="tw" d="M320 100 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" fill="#d4a73c"/>
<path class="tw" style="animation-delay:1.1s" d="M480 210 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#d4a73c"/>
<!-- dressing table -->
<rect x="40" y="420" width="720" height="80" fill="#e7a9bd"/><rect x="40" y="410" width="720" height="14" rx="5" fill="#d48aa3"/>
<!-- lipstick -->
<g transform="translate(120 0)">
 <clipPath id="lc"><rect x="-30" y="250" width="60" height="110"/></clipPath>
 <g clip-path="url(#lc)"><g class="lip"><path d="M-14 300 L-14 260 Q0 236 14 252 L14 300 Z" fill="#c2185b"/><rect x="-16" y="296" width="32" height="20" fill="url(#gold)"/></g></g>
 <rect x="-20" y="310" width="40" height="100" rx="5" fill="#2b1b2e"/><rect x="-20" y="310" width="40" height="14" fill="url(#gold)"/>
</g>
<!-- compact powder -->
<g>
 <ellipse cx="330" cy="395" rx="62" ry="18" fill="#b58324"/>
 <ellipse cx="330" cy="385" rx="62" ry="18" fill="url(#gold)"/><ellipse cx="330" cy="383" rx="48" ry="12" fill="url(#powder)"/>
 <g class="lid"><ellipse cx="330" cy="360" rx="62" ry="18" fill="url(#gold)"/><ellipse cx="330" cy="358" rx="46" ry="12" fill="#fff" opacity=".8"/></g>
</g>
<!-- brush dusting with powder puffs -->
<g class="brush"><rect x="514" y="300" width="12" height="120" rx="6" fill="#2b1b2e"/><rect x="512" y="285" width="16" height="22" fill="url(#gold)"/><path d="M508 288 Q520 220 532 288 Z" fill="#e7a091"/></g>
<g class="puff" fill="#f4b8a8"><circle style="--x:-30px" cx="520" cy="250" r="10"/><circle style="--x:20px;animation-delay:.5s" cx="522" cy="250" r="8"/><circle style="--x:-10px;animation-delay:1s" cx="518" cy="250" r="12"/><circle style="--x:35px;animation-delay:1.5s" cx="520" cy="250" r="7"/></g>
<!-- nail polish -->
<g transform="translate(680 0)">
 <path d="M-34 410 Q-40 340 -24 330 L24 330 Q40 340 34 410 Z" fill="#e91e63"/>
 <path class="shine" d="M-22 345 Q-26 380 -20 400" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
 <rect x="-12" y="318" width="24" height="14" fill="#c2185b"/>
 <g class="cap"><rect x="-14" y="262" width="28" height="58" rx="5" fill="url(#gold)"/><line x1="0" y1="320" x2="0" y2="350" stroke="#7a5a1a" stroke-width="3"/><ellipse cx="0" cy="352" rx="5" ry="8" fill="#e91e63"/></g>
</g>
<text x="400" y="472" text-anchor="middle" font-size="20" fill="#7a2e4e" font-style="italic">Facials · Hair Styling · Makeup · Bridal Studio</text>
</svg>
