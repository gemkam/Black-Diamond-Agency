<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde8ee"/><stop offset="1" stop-color="#f6c9d6"/></linearGradient>
 <linearGradient id="mir" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9d6f2"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a2e1c"/><stop offset="1" stop-color="#2b140c"/></linearGradient>
</defs>
<style>
 .strand{transform-box:fill-box;transform-origin:0% 0%;animation:blow 1.2s ease-in-out infinite alternate}
 .s2{animation-delay:.2s}.s3{animation-delay:.4s}
 @keyframes blow{from{transform:rotate(-4deg) scaleX(1)}to{transform:rotate(7deg) scaleX(1.08)}}
 .dryer{transform-origin:575px 175px;animation:dry 2.4s ease-in-out infinite}
 @keyframes dry{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(5deg) translateY(10px)}}
 .air path{stroke-dasharray:16 14;animation:air .6s linear infinite}
 @keyframes air{to{stroke-dashoffset:-60}}
 .air{animation:dry 2.4s ease-in-out infinite;transform-origin:575px 175px}
 .spark{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
 .smile{animation:blink 4s infinite}
 @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>
<!-- mirror with lights -->
<rect x="60" y="50" width="260" height="300" rx="130" fill="url(#mir)" stroke="#d9a7b8" stroke-width="10"/>
<g fill="#ffe9a8"><circle cx="70" cy="200" r="9"/><circle cx="310" cy="200" r="9"/><circle cx="190" cy="52" r="9"/><circle cx="95" cy="110" r="8"/><circle cx="285" cy="110" r="8"/></g>
<path class="spark" d="M150 150 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#fff"/>
<path class="spark" style="animation-delay:1s" d="M240 250 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#fff"/>
<!-- counter -->
<rect x="40" y="350" width="300" height="20" rx="6" fill="#c9849a"/>
<rect x="80" y="320" width="18" height="30" rx="4" fill="#9b5de5"/><rect x="110" y="310" width="14" height="40" rx="4" fill="#f15bb5"/><circle cx="270" cy="335" r="16" fill="#fee440"/>
<!-- floor -->
<rect y="440" width="800" height="60" fill="#e7aebf"/>
<!-- salon chair -->
<rect x="395" y="250" width="40" height="150" rx="16" fill="#3a2a4a"/>
<rect x="395" y="330" width="170" height="40" rx="14" fill="#3a2a4a"/>
<rect x="470" y="370" width="16" height="50" fill="#9a9aa8"/><ellipse cx="478" cy="430" rx="60" ry="10" fill="#9a9aa8"/>
<!-- client: cape, neck, head, hair -->
<path d="M420 250 Q480 230 540 250 L560 360 L410 360 Z" fill="#ffffff" stroke="#e5c3cf" stroke-width="3"/>
<rect x="465" y="220" width="22" height="34" rx="8" fill="#f1c19c"/>
<g class="strand"><path d="M440 160 Q400 220 430 300 Q445 250 455 200 Z" fill="url(#hair)"/></g>
<g class="strand s2"><path d="M445 150 Q395 190 405 270 Q430 230 450 185 Z" fill="#4a2414"/></g>
<g class="strand s3"><path d="M450 145 Q410 160 412 230 Q440 200 455 170 Z" fill="#6b3a22"/></g>
<circle cx="478" cy="185" r="40" fill="#f1c19c"/>
<path d="M440 175 Q450 130 490 140 Q520 150 515 175 Q495 160 470 162 Q455 165 440 175 Z" fill="url(#hair)"/>
<g class="smile" style="transform-origin:500px 182px"><circle cx="500" cy="182" r="3.5" fill="#3b2318"/></g>
<path d="M494 200 Q503 207 512 199" stroke="#c0504d" stroke-width="3" fill="none" stroke-linecap="round"/>
<!-- stylist -->
<circle cx="640" cy="150" r="32" fill="#c98d64"/>
<path d="M608 140 Q615 100 650 108 Q675 115 672 145 Q650 125 625 135 Z" fill="#1b1b2b"/>
<circle cx="628" cy="152" r="3" fill="#1b1b2b"/>
<path d="M600 190 Q640 175 680 190 L700 440 L590 440 Z" fill="#2b2d42"/>
<rect x="600" y="190" width="80" height="12" rx="6" fill="#f15bb5"/>
<!-- arm + dryer -->
<g class="dryer">
 <path d="M610 210 Q590 200 575 185" stroke="#c98d64" stroke-width="16" stroke-linecap="round" fill="none"/>
 <rect x="545" y="150" width="70" height="40" rx="18" fill="#f15bb5"/>
 <rect x="520" y="160" width="32" height="20" rx="6" fill="#d63d97"/>
 <rect x="585" y="185" width="18" height="40" rx="6" fill="#d63d97"/>
 <circle cx="595" cy="170" r="8" fill="#ffd6ec"/>
</g>
<g class="air" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".9">
 <path d="M518 163 Q495 150 470 152"/><path d="M518 172 Q492 172 462 168"/><path d="M518 180 Q495 190 468 186"/>
</g>
<text x="400" y="480" text-anchor="middle" font-size="22" fill="#8a3d58" font-style="italic">Hair · Makeup · Bridal Studio</text>
</svg>
