<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1340"/><stop offset="1" stop-color="#5a2a4a"/></linearGradient>
<radialGradient id="lg"><stop offset="0" stop-color="#ffd27a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>
<style>
 .sw{animation:sw 3s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
 .cloth{animation:cl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}@keyframes cl{0%,100%{transform:skewX(4deg)}50%{transform:skewX(-4deg)}}
 .flick{animation:fl 1.8s ease-in-out infinite}@keyframes fl{0%,100%{opacity:.6}50%{opacity:1}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>
<!-- awning -->
<path d="M60 120 L740 120 L760 175 L40 175 Z" fill="#c0392b"/>
<g fill="#f5d06f"><path d="M40 175 q42 30 85 0z"/><path d="M125 175 q42 30 85 0z"/><path d="M210 175 q42 30 85 0z"/><path d="M295 175 q42 30 85 0z"/><path d="M380 175 q42 30 85 0z"/><path d="M465 175 q42 30 85 0z"/><path d="M550 175 q42 30 85 0z"/><path d="M635 175 q42 30 85 0z"/><path d="M720 175 q20 30 40 0z"/></g>
<rect x="60" y="120" width="12" height="320" fill="#6b3b22"/><rect x="728" y="120" width="12" height="320" fill="#6b3b22"/>
<text x="400" y="158" text-anchor="middle" font-size="30" fill="#fff4d6" font-style="italic">Bazaar Royale</text>
<!-- hanging shawls -->
<line x1="90" y1="215" x2="710" y2="215" stroke="#8a5a32" stroke-width="5"/>
<g class="cloth"><rect x="110" y="215" width="70" height="140" fill="#1e6f8c"/><path d="M110 330 h70" stroke="#f5d06f" stroke-width="4"/><path d="M110 300 h70" stroke="#f5d06f" stroke-width="2"/></g>
<g class="cloth" style="animation-delay:.3s"><rect x="195" y="215" width="70" height="160" fill="#b03a6f"/><path d="M195 350 h70" stroke="#f5d06f" stroke-width="4"/><circle cx="230" cy="270" r="14" fill="none" stroke="#f5d06f" stroke-width="3"/></g>
<g class="cloth" style="animation-delay:.6s"><rect x="280" y="215" width="70" height="130" fill="#e3a72f"/><path d="M280 320 h70" stroke="#7a1f1f" stroke-width="4"/></g>
<g class="cloth" style="animation-delay:.9s"><rect x="450" y="215" width="70" height="150" fill="#2f7d4f"/><path d="M450 340 h70" stroke="#f5d06f" stroke-width="4"/></g>
<g class="cloth" style="animation-delay:1.2s"><rect x="535" y="215" width="70" height="135" fill="#6c3fb0"/><path d="M535 325 h70" stroke="#f5d06f" stroke-width="4"/></g>
<!-- lanterns -->
<g class="sw" style="transform-origin:400px 180px"><line x1="400" y1="180" x2="400" y2="230" stroke="#c9a14a" stroke-width="3"/><circle cx="400" cy="262" r="60" fill="url(#lg)" class="flick"/><path d="M380 230 h40 l10 20 v30 l-10 20 h-40 l-10 -20 v-30z" fill="#d4a03c"/><rect x="385" y="250" width="30" height="34" fill="#ffe7a1" class="flick"/></g>
<g class="sw" style="transform-origin:660px 180px;animation-delay:.7s"><line x1="660" y1="180" x2="660" y2="225" stroke="#c9a14a" stroke-width="3"/><path d="M645 225 h30 l8 16 v24 l-8 16 h-30 l-8 -16 v-24z" fill="#d4a03c"/><rect x="650" y="240" width="20" height="26" fill="#ffe7a1" class="flick"/></g>
<!-- counter with pottery -->
<rect x="80" y="380" width="640" height="70" rx="6" fill="#7a4526"/>
<path d="M150 380 q-30 -50 0 -70 h30 q30 20 0 70z" fill="#2b6cb0"/><path d="M150 330 h30" stroke="#fff" stroke-width="3"/>
<path d="M260 380 q-25 -40 5 -55 h20 q30 15 5 55z" fill="#c05621"/>
<ellipse cx="380" cy="372" rx="40" ry="10" fill="#c9a14a"/><path d="M345 372 q35 -40 70 0" fill="#d4a03c"/>
<path d="M520 380 q-30 -50 0 -70 h30 q30 20 0 70z" fill="#2f855a"/>
<path d="M620 380 l20 -50 h20 l20 50z" fill="#b7791f"/>
<text x="400" y="480" text-anchor="middle" font-size="18" fill="#f5d06f" font-style="italic">Shawls · Bridal · Pottery · Brass · Footwear</text>
</svg>
